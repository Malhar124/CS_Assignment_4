<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Network Diagnostics</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }
    .card {
      background: #ffffff;
      max-width: 620px;
      width: 100%;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      padding: 24px;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 1.25rem;
      color: #0f172a;
    }
    .subtitle {
      color: #64748b;
      font-size: 0.88rem;
      margin-bottom: 20px;
    }
    .mode-bar {
      display: flex;
      align-items: center;
      gap: 20px;
      background: #f1f5f9;
      padding: 10px 14px;
      border-radius: 6px;
      margin-bottom: 18px;
      font-size: 0.9rem;
    }
    .mode-bar span {
      font-weight: 600;
      color: #334155;
    }
    .mode-bar label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      color: #1e293b;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label.field-label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 6px;
      color: #334155;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus {
      border-color: #2563eb;
    }
    button {
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    button:hover {
      background: #1d4ed8;
    }
    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .console-header {
      font-size: 0.82rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 24px;
      margin-bottom: 8px;
    }
    pre {
      background: #0f172a;
      color: #e2e8f0;
      padding: 14px;
      border-radius: 6px;
      font-family: Consolas, Monaco, monospace;
      font-size: 0.85rem;
      line-height: 1.45;
      min-height: 130px;
      max-height: 320px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Network Diagnostics</h2>
    <div class="subtitle">Ping utility for reachability verification</div>

    <!-- Mode option at the top -->
    <div class="mode-bar">
      <span>Mode:</span>
      <label>
        <input type="radio" name="mode" value="mode1" checked>
        Mode 1
      </label>
      <label>
        <input type="radio" name="mode" value="mode2">
        Mode 2
      </label>
    </div>

    <!-- Input fields -->
    <form id="diagForm" onsubmit="runPing(event)">
      <div class="form-group">
        <label class="field-label" for="target">Target Host / IP Address:</label>
        <input type="text" id="target" placeholder="e.g. 127.0.0.1 or google.com" required>
      </div>

      <button type="submit" id="submitBtn">Run Diagnostic</button>
    </form>

    <!-- Console Output -->
    <div class="console-header">Console Output</div>
    <pre id="output">Ready. Enter host and click "Run Diagnostic".</pre>
  </div>

  <script>
    async function runPing(e) {
      e.preventDefault();
      const target = document.getElementById('target').value.trim();
      const mode = document.querySelector('input[name="mode"]:checked').value;
      const outputElem = document.getElementById('output');
      const submitBtn = document.getElementById('submitBtn');

      if (!target) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Running...';
      outputElem.textContent = 'Executing request...\n';

      try {
        const res = await fetch('/api/ping', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ target, mode })
        });
        const data = await res.json();
        outputElem.textContent = data.output;
      } catch (err) {
        outputElem.textContent = 'Error: ' + err.message;
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Run Diagnostic';
      }
    }
  </script>

</body>
</html>
