<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Tasks | XSS Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <h1>Nexus Tasks</h1>
        <p class="subtitle">What needs to be done today?</p>
        
        <form method="POST" action="/add-todo">
            <input type="text" name="todo" placeholder="Add a new task..." required autocomplete="off">
            <button type="submit">Add Task</button>
        </form>

        <div class="todo-list">
            {{TODOS_HTML}}
        </div>

        <form method="POST" action="/clear-todos" style="margin-top: 30px; text-align: center;">
            <button type="submit" style="background: rgba(255, 69, 58, 0.5); border: 1px solid rgba(255, 69, 58, 0.8); color: #ffe5e5; border-radius: 8px; font-size: 0.9rem; padding: 10px 20px;">Clear All Tasks</button>
        </form>
    </div>

    <script src="/script.js"></script>
</body>
</html>
